{% extends "base.html" %}
{% block title %}{{ text.login_title }}{% endblock %}
{% block body %}
<main data-column>
  <p>{{ text.wordmark }}</p>
  <h1>{{ text.login_title }}</h1>
  {% if refused %}<p role="alert">{{ text.login_refused }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="username">{{ text.login_username }}</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">{{ text.login_password }}</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
    <button type="submit">{{ text.login_submit }}</button>
  </form>
</main>
{% endblock %}
