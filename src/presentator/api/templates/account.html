{% extends "base.html" %}
{% block title %}{{ text.account_title }}{% endblock %}
{% block body %}
<main>
  <header>
    <h1>{{ text.account_title }}</h1>
  </header>
  <p>{{ person.username }} <small>{{ role }}</small></p>
  <form hx-post="/account" hx-trigger="change">
    <fieldset>
      <legend>{{ text.account_preferences }}</legend>
      <label for="language">{{ text.account_language }}</label>
      <select id="language" name="language">
        {% for language in languages %}
        <option value="{{ language.value }}"
                {% if language.chosen %}selected{% endif %}>{{ language.label }}</option>
        {% endfor %}
      </select>
      <label for="theme">{{ text.account_theme }}</label>
      <select id="theme" name="theme">
        {% for look in themes %}
        <option value="{{ look.value }}"
                {% if look.chosen %}selected{% endif %}>{{ look.label }}</option>
        {% endfor %}
      </select>
    </fieldset>
  </form>
</main>
{% endblock %}
