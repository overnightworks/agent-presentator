{% extends "base.html" %}
{% block title %}{{ text.login_failed_title }}{% endblock %}
{% block body %}
<main data-column>
  <p>{{ text.wordmark }}</p>
  <h1>{{ text.login_failed_title }}</h1>
  <div class="banner banner--fail">
    <span class="glyph" aria-hidden="true"></span>
    <div class="banner-body">
      <p>{{ text.login_failed_explanation }}</p>
    </div>
  </div>
  <p data-actions>
    <a data-action data-wide href="{{ start_sign_in }}">{{ text.login_failed_retry }}</a>
  </p>
</main>
{% endblock %}
