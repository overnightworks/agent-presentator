[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "copresenter"
version = "0.0.0"
requires-python = ">=3.12"
description = "A voice that knows the deck: Claude answers, local speech speaks and hears."
dependencies = [
    "fastapi==0.141.1",
    "httpx>=0.27,<1",
    "overnightworks-agent-client @ https://github.com/overnightworks/agent-providers/releases/download/v0.5.0/overnightworks_agent_client-0.5.0-py3-none-any.whl#sha256=9019e18411e6338629a5397a4f58b0b3cbd70f4b2cbd8184b97a3d53ee8ed94a",
    "overnightworks-agent-providers @ https://github.com/overnightworks/agent-providers/releases/download/v0.5.0/overnightworks_agent_providers-0.5.0-py3-none-any.whl#sha256=16dd220515e00a45fdb00cb92f62a56e46a30d0cfdd7cfdf59529cd0b60d9789",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
    "websockets>=14,<16",
]

[project.scripts]
copresenter = "copresenter.main:main"
copresenter-standin = "copresenter.standin:main"

[dependency-groups]
dev = [
    "playwright==1.62.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/copresenter"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "TC001",
    "TC002",
    "TC003",
    "PLR0913",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D102", "D103", "D104", "D107", "ARG002", "ANN001", "ANN201", "PLR2004"]
"tests/test_prove_loop.py" = ["SLF001"]
"src/copresenter/standin.py" = ["S104"]
"scripts/**" = ["INP001", "S108", "S603", "S607", "T201", "ANN001", "ANN002", "ANN003", "ANN204", "D103", "TRY300", "PLC0415"]
