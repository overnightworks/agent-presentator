[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "copresenter"
version = "0.0.0"
requires-python = ">=3.12"
description = "A voice that knows the deck: Claude answers, local speech speaks and hears."
dependencies = [
    "anthropic>=0.26,<2",
    "fastapi==0.141.1",
    "httpx>=0.27,<1",
    "overnightworks-agent-providers @ https://github.com/overnightworks/agent-providers/releases/download/v0.1.0/overnightworks_agent_providers-0.1.0-py3-none-any.whl#sha256=abd5ae053a4413a5bb3d8ed6b13ac0e455a72b7f7e44a9dfed1f3fdad8e6e433",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.4",
    "websockets>=14,<16",
]

[project.scripts]
copresenter = "copresenter.main:main"
copresenter-standin = "copresenter.standin:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/copresenter"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "TC001",
    "TC002",
    "TC003",
    "PLR0913",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D102", "D103", "D104", "D107", "ARG002", "ANN001", "ANN201", "PLR2004"]
"src/copresenter/standin.py" = ["S104"]
"scripts/**" = ["INP001", "S108", "S603", "S607", "T201", "ANN001", "ANN002", "ANN003", "ANN204", "D103", "TRY300", "PLC0415"]
