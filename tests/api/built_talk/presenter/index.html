<!DOCTYPE html>
<!-- Stands in for what `slidev build` writes: the presenter view, the slide
     beside its notes, reading the slide out of the address. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Presenter · Hello Co-Presenter</title>
    <style>
      body { background: #1C2128; color: #E8ECF0; font: 1rem/1.5 system-ui, sans-serif; margin: 0; }
      main { display: grid; gap: 1rem; grid-template-columns: 1fr; padding: 1rem; }
      @media (min-width: 700px) { main { grid-template-columns: 3fr 2fr; } }
      section { background: #14181D; border-radius: 8px; display: grid; place-items: center; padding: 2rem; }
      h1 { font-size: clamp(1.5rem, 5vw, 3rem); margin: 0; text-align: center; }
      aside { color: #9BA5B1; }
      nav { display: flex; gap: 1rem; padding: 0 1rem 1rem; }
      a { color: #56C3CD; }
    </style>
  </head>
  <body>
    <main>
      <section><h1 id="slide"></h1></section>
      <aside><p id="notes"></p></aside>
    </main>
    <nav>
      <a href="#/1">1</a>
      <a href="#/2">2</a>
    </nav>
    <script>
      const slides = ["Hello Co-Presenter", "Thank you"];
      const notes = ["Say hello, name the deck.", "Ask for questions."];
      const show = () => {
        const number = Number(location.hash.replace("#/", "")) || 1;
        document.getElementById("slide").textContent =
          `${number}. ${slides[number - 1] ?? slides[0]}`;
        document.getElementById("notes").textContent =
          notes[number - 1] ?? notes[0];
      };
      addEventListener("hashchange", show);
      show();
    </script>
  </body>
</html>
