<!DOCTYPE html>
<!-- Stands in for what `slidev build` writes: the projector view as one page
     that reads the slide out of the address, so nothing here needs Node. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello Co-Presenter</title>
    <style>
      body { background: #14181D; color: #FFFFFF; font: 1rem/1.5 system-ui, sans-serif; margin: 0; }
      main { align-items: center; display: flex; height: 100vh; justify-content: center; }
      h1 { font-size: clamp(2rem, 8vw, 5rem); margin: 0; text-align: center; }
      nav { bottom: 1rem; display: flex; gap: 1rem; position: fixed; right: 1rem; }
      a { color: #56C3CD; }
    </style>
  </head>
  <body>
    <main><h1 id="slide"></h1></main>
    <nav>
      <a href="#/1">1</a>
      <a href="#/2">2</a>
    </nav>
    <script>
      const slides = ["Hello Co-Presenter", "Thank you"];
      const show = () => {
        const number = Number(location.hash.replace("#/", "")) || 1;
        document.getElementById("slide").textContent =
          `${number}. ${slides[number - 1] ?? slides[0]}`;
      };
      addEventListener("hashchange", show);
      show();
    </script>
  </body>
</html>
