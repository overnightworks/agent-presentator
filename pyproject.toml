[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-presentator"
version = "0.0.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "babel==2.18.0",
    "cryptography==50.0.2",
    "fastapi==0.141.1",
    "httpx2[ws]==2.13.1",
    "jinja2==3.1.6",
    "overnightworks-agent-client @ https://github.com/overnightworks/agent-providers/releases/download/v0.6.0/overnightworks_agent_client-0.6.0-py3-none-any.whl#sha256=c402d87f5569b47f8a34b8205e33ca2011b003acb13ba89ec784004e5891df4e",
    "overnightworks-webauth @ https://github.com/overnightworks/webauth/releases/download/v0.21.0/overnightworks_webauth-0.21.0-py3-none-any.whl#sha256=87153ece90108270ba9ea9c364a163bd2dd5ed4c2a1cd1fbed4e5d92554fa37a",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "syntok==1.4.4",
    "uvicorn==0.54.0",
]

[project.scripts]
presentator = "presentator.host.main:main"
presentator-worker = "presentator.host.worker:main"

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyright==1.1.414",
    "ruff==0.17.1",
    "vulture==2.16",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gitmirror", "src/presentator"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
# assert_never marks an exhaustiveness guard that pyright proves unreachable;
# excluding the whole `case _:` arm also drops the arc into it.
exclude_also = ["case _:\\n\\s+assert_never\\("]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.vulture]
paths = ["src", "tests", "tests/vulture_allowlist.py"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The formatter owns trailing commas; the rule fights it.
    "COM812",
    # This repository carries no per-file copyright header.
    "CPY001",
]

[tool.ruff.lint.flake8-type-checking]
# A pydantic field's annotation is read at runtime, so its import is not type-only.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest states its expectations with bare `assert`; a test's name already states
# the behaviour a docstring would repeat, and a double's method repeats the
# contract the port it stands in for already carries.
# A double honours the signature of the port it stands in for, even where its
# canned answer has no use for an argument.
"tests/**" = ["S101", "D102", "D103", "ARG002"]
# Standalone gate, not a package; it must spawn the git executable PATH names.
"scripts/check_root_layout.py" = ["INP001", "S404", "S603"]
# Drives a temporary git repository and the check script as a process.
"tests/test_root_layout.py" = ["S404", "S603"]
# Standalone proof, not a package; it drives docker and git by name through
# fixed argument vectors, never a shell.
"scripts/prove_container_build.py" = ["INP001", "S404", "S603", "S607"]
# Standalone probe, not a package; it drives docker and pdftotext by name
# through fixed argument vectors, never a shell, and inside the container it is
# the client of the worker's socket.
"scripts/probe_build_worker.py" = ["INP001", "S404", "S603", "S607"]
"scripts/probe_build_worker_harness.py" = ["INP001", "S404", "S603", "S607"]
"scripts/probe_build_worker_isolation.py" = ["INP001", "S404", "S603", "S607"]
"scripts/probe_build_worker_lives.py" = ["INP001", "S404", "S603", "S607"]
"scripts/probe_build_worker_refusals.py" = ["INP001", "S404", "S603", "S607"]
"scripts/probe_build_worker_uploads.py" = ["INP001"]
# The attack deck's ctypes child and the programs sent to the worker on stdin.
"scripts/probe_build_worker/attack/kernel_attacks.py" = ["INP001"]
"scripts/probe_build_worker/next_life.py" = ["INP001"]
"scripts/probe_build_worker/upload_watcher.py" = ["INP001"]
"scripts/probe_build_worker/flood/flood_actions.py" = ["INP001"]
# Standalone gate, not a package; it only parses templates to an AST, it
# never renders one, so autoescape has no effect on its behaviour.
"scripts/check_catalog_purity.py" = ["INP001", "S701"]
# Drives the check script as a subprocess against temporary and real templates.
"tests/test_catalog_purity.py" = ["S404", "S603"]
# `vulture` reads a whitelist as bare attribute expressions; naming a field
# there is the entry, and assigning it would only move the dead name.
"tests/vulture_allowlist.py" = ["B018"]
# Mirroring a remote is spawning `git`; the executable is resolved on PATH and
# every argument is built here, never taken from a request.
"src/gitmirror/mirror.py" = ["S404", "S603"]
# Building a deck is spawning the Node toolchain, or the Docker client that
# gives it a container; both programs are constants resolved on PATH, and every
# argument is built here out of the deck's own row, never out of a request.
"src/presentator/adapters/builds.py" = ["S404", "S603"]
# Spawning the build worker's children is the gate shell and the wire entry,
# both named here and handed only a descriptor list, never a request.
"src/presentator/adapters/worker_children.py" = ["S404", "S603"]
# Runs the gate shell and a stalled controller as real processes.
"tests/adapters/test_worker_children.py" = ["S404", "S603"]
# Spawns children of its own to prove which of them the reap collects.
"tests/test_worker_termination.py" = ["S404", "S603"]
# Drives that toolchain and that client as the stand-in scripts it puts on PATH.
"tests/adapters/test_builds.py" = ["S404", "S603"]
# Builds the temporary git repositories every layer that reads one is proven on.
"tests/conftest.py" = ["S404", "S603", "S607"]
# Asks the real `git` whether it accepts the credential configuration it is given.
"tests/gitmirror/test_mirror.py" = ["S404", "S603", "S607"]
# Asks the same of the credential a source's own row carries.
"tests/adapters/test_decks.py" = ["S404", "S603", "S607"]

[tool.importlinter]
root_packages = ["presentator", "gitmirror"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Presentator package layers"
type = "layers"
containers = ["presentator"]
layers = ["host", "api", "application", "ports", "contracts"]

[[tool.importlinter.contracts]]
id = "adapters-reach-down-only"
name = "Adapters never reach up into application, api, or host"
type = "forbidden"
source_modules = ["presentator.adapters"]
forbidden_modules = [
    "presentator.application",
    "presentator.api",
    "presentator.host",
]
as_packages = true

[[tool.importlinter.contracts]]
id = "adapters-are-chosen-by-the-host"
name = "Only the host names an adapter"
type = "forbidden"
source_modules = [
    "presentator.application",
    "presentator.api",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["presentator.adapters"]
as_packages = true

[[tool.importlinter.contracts]]
id = "route-vocabulary"
name = "Routes name no port type"
type = "forbidden"
source_modules = ["presentator.api"]
forbidden_modules = ["presentator.ports"]
as_packages = true
# A route reaching a port through the application it is allowed to import is the
# legal chain, not a violation; only naming a port type in the api itself is.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "gitmirror-is-independent"
name = "gitmirror never imports the product"
type = "forbidden"
# ADR 0010: the dependency runs one way, so the package can move to its own
# repository and be consumed by tag when its second caller arrives.
source_modules = ["gitmirror"]
forbidden_modules = ["presentator"]
as_packages = true

[[tool.importlinter.contracts]]
id = "gitmirror-belongs-to-an-adapter"
name = "Only an adapter names gitmirror"
type = "forbidden"
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["gitmirror"]
as_packages = true
# The host composes the adapter that owns it, so the legal chain runs through
# it; only naming the package in a layer above is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "manifest-and-wording-libraries"
name = "Only adapters read the manifest format and word a language"
type = "forbidden"
# ADR 0001: a third-party or format library lives in the adapter that owns it.
# `tomllib` reads the deck manifest and `babel` owns the catalog and the
# wording of an age, so a layer above must ask a port or be handed the words.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["tomllib", "babel"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "sentence-library"
name = "Only adapters find sentence boundaries"
type = "forbidden"
# ADR 0001: a third-party library lives in the adapter that owns it. `syntok`
# finds the boundaries, so a layer above is handed the function instead.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["syntok"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "process-spawning"
name = "Only adapters spawn a process"
type = "forbidden"
# ADR 0001: the toolchain that builds a deck is an external process, and where
# it is spawned is the adapter that owns it. A layer above asks a port.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["subprocess"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "database-library"
name = "Only adapters import the database library"
type = "forbidden"
# ADR 0001: a third-party library lives in the adapter that owns it, and its
# contract is written with its first import. `sqlite3` is the store, so a layer
# above must ask a port instead.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["sqlite3"]
as_packages = true
# The host composes the adapter that owns it, so the legal chain runs through
# it; only naming the library in a layer above is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "webauth-library"
name = "Only adapters and the host import webauth"
type = "forbidden"
# ADR 0003: the library owns the login mechanism. Adapters fill its ports;
# the host composes WebAuthConfig. The api is not in this list because the
# routes must read the installed config, sign and clear cookies, answer an
# unauthenticated request, and read client identity, and install
# CsrfOriginMiddleware (webauth.config, webauth.cookies, webauth.dependencies,
# webauth.proxies, webauth.middleware, webauth.ports).
source_modules = [
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["webauth"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "encryption-library"
name = "Only adapters import the encryption library"
type = "forbidden"
# ADR 0013: every parameter of the encryption stands in the adapter that owns
# it, so a layer above asks a port or is handed bytes it cannot read.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["cryptography"]
as_packages = true
# The host composes the adapter that owns it, so the legal chain runs through
# it; only naming the library in a layer above is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "private-transport-library"
name = "Only private-service adapters import httpx2"
type = "forbidden"
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["httpx2"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "agent-client-library"
name = "Only adapters import agent_client"
type = "forbidden"
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["agent_client"]
as_packages = true
allow_indirect_imports = true
