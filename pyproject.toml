[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "agent-presentator"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "babel==2.18.0",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "uvicorn==0.52.4",
]

[project.scripts]
agent-presentator = "presentator.host.main:main"

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "import-linter==2.13",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyright==1.1.411",
    "ruff==0.16.2",
    "vulture==2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gitmirror", "src/presentator"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.vulture]
paths = ["src", "tests", "tests/vulture_allowlist.py"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The formatter owns trailing commas; the rule fights it.
    "COM812",
    # This repository carries no per-file copyright header.
    "CPY001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest states its expectations with bare `assert`; a test's name already states
# the behaviour a docstring would repeat, and a double's method repeats the
# contract the port it stands in for already carries.
# A double honours the signature of the port it stands in for, even where its
# canned answer has no use for an argument.
"tests/**" = ["S101", "D102", "D103", "ARG002"]
# Standalone gate, not a package; it must spawn the git executable PATH names.
"scripts/check_root_layout.py" = ["INP001", "S404", "S603"]
# Drives a temporary git repository and the check script as a process.
"tests/test_root_layout.py" = ["S404", "S603"]
# Standalone gate, not a package; it only parses templates to an AST, it
# never renders one, so autoescape has no effect on its behaviour.
"scripts/check_catalog_purity.py" = ["INP001", "S701"]
# Drives the check script as a subprocess against temporary and real templates.
"tests/test_catalog_purity.py" = ["S404", "S603"]
# `vulture` reads a whitelist as bare attribute expressions; naming a field
# there is the entry, and assigning it would only move the dead name.
"tests/vulture_allowlist.py" = ["B018"]
# Mirroring a remote is spawning `git`; the executable is resolved on PATH and
# every argument is built here, never taken from a request.
"src/gitmirror/mirror.py" = ["S404", "S603"]
# Building a deck is spawning the Node toolchain; the program is a constant
# resolved on PATH, and every argument is built here out of the deck's own row,
# never out of a request.
"src/presentator/adapters/builds.py" = ["S404", "S603"]
# Drives that toolchain as the stand-in script it puts on PATH.
"tests/adapters/test_builds.py" = ["S404", "S603"]
# Builds the temporary git repositories every layer that reads one is proven on.
"tests/conftest.py" = ["S404", "S603", "S607"]
# Asks the real `git` whether it accepts the credential configuration it is given.
"tests/gitmirror/test_mirror.py" = ["S404", "S603", "S607"]

[tool.importlinter]
root_packages = ["presentator", "gitmirror"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Presentator package layers"
type = "layers"
containers = ["presentator"]
layers = ["host", "api", "application", "ports", "contracts"]

[[tool.importlinter.contracts]]
id = "adapters-reach-down-only"
name = "Adapters never reach up into application, api, or host"
type = "forbidden"
source_modules = ["presentator.adapters"]
forbidden_modules = [
    "presentator.application",
    "presentator.api",
    "presentator.host",
]
as_packages = true

[[tool.importlinter.contracts]]
id = "adapters-are-chosen-by-the-host"
name = "Only the host names an adapter"
type = "forbidden"
source_modules = [
    "presentator.application",
    "presentator.api",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["presentator.adapters"]
as_packages = true

[[tool.importlinter.contracts]]
id = "route-vocabulary"
name = "Routes name no port type"
type = "forbidden"
source_modules = ["presentator.api"]
forbidden_modules = ["presentator.ports"]
as_packages = true
# A route reaching a port through the application it is allowed to import is the
# legal chain, not a violation; only naming a port type in the api itself is.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "gitmirror-is-independent"
name = "gitmirror never imports the product"
type = "forbidden"
# ADR 0010: the dependency runs one way, so the package can move to its own
# repository and be consumed by tag when its second caller arrives.
source_modules = ["gitmirror"]
forbidden_modules = ["presentator"]
as_packages = true

[[tool.importlinter.contracts]]
id = "gitmirror-belongs-to-an-adapter"
name = "Only an adapter names gitmirror"
type = "forbidden"
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["gitmirror"]
as_packages = true
# The host composes the adapter that owns it, so the legal chain runs through
# it; only naming the package in a layer above is the violation.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "manifest-and-wording-libraries"
name = "Only adapters read the manifest format and word a language"
type = "forbidden"
# ADR 0001: a third-party or format library lives in the adapter that owns it.
# `tomllib` reads the deck manifest and `babel` owns the catalog and the
# wording of an age, so a layer above must ask a port or be handed the words.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["tomllib", "babel"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "process-spawning"
name = "Only adapters spawn a process"
type = "forbidden"
# ADR 0001: the toolchain that builds a deck is an external process, and where
# it is spawned is the adapter that owns it. A layer above asks a port.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["subprocess"]
as_packages = true
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "auth-and-database-libraries"
name = "Only adapters import the auth and the database library"
type = "forbidden"
# ADR 0001: a third-party library lives in the adapter that owns it, and its
# contract is written with its first import. `pwdlib` hashes passwords and
# `sqlite3` is the store, so a layer above must ask a port instead.
source_modules = [
    "presentator.host",
    "presentator.api",
    "presentator.application",
    "presentator.ports",
    "presentator.contracts",
]
forbidden_modules = ["pwdlib", "sqlite3"]
as_packages = true
# The host composes the adapter that owns them, so the legal chain runs through
# it; only naming the library in a layer above is the violation.
allow_indirect_imports = true
