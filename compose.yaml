# One service is the instance, and a second, the build worker, only waits for a
# caller that does not exist yet. What has to survive the instance stands in a
# named volume; what may never be written down here comes from the environment.
#
# The image below is handed to the server as well as to Docker, because a deck
# is code: the server asks this machine's daemon to run every build in a
# container of that image, over directories of the builds volume (line 14a).
x-build-image: &build_image presentator-build

services:
  presentator:
    build:
      context: .
      args:
        PRESENTATOR_RUNTIME_UID: ${PRESENTATOR_RUNTIME_UID:?set it to the positive non-root uid shared by Presentator and the host co-presenter}
    image: presentator
    user: presentator
    # A build spawns a process tree of its own, and a step given up on leaves
    # its grandchildren to be reaped by whatever is process 1.
    init: true
    # The tunnel of ADR 0007 runs on this machine and enters here, so the
    # address is offered to this machine alone — and the instance sees that
    # connection as the network's gateway below, which is the address
    # PRESENTATOR_TRUSTED_PROXIES has to name.
    ports:
      - "127.0.0.1:8000:8000"
    # Whatever the operator's own file carries, including the variable a
    # source's credential names. This repository never writes that file.
    env_file:
      - path: .env
        required: false
    environment:
      PRESENTATOR_SECRET_KEY: ${PRESENTATOR_SECRET_KEY:?set it to at least 32 random characters; an instance without it refuses to start}
      PRESENTATOR_PUBLIC_ORIGIN: ${PRESENTATOR_PUBLIC_ORIGIN:?set it to the one canonical browser origin}
      PRESENTATOR_TALK_ORIGIN: ${PRESENTATOR_TALK_ORIGIN:?set it to the talk host's canonical browser origin, on another hostname}
      PRESENTATOR_COPRESENTER_SOCKET: /run/presentator-copresenter/copresenter.sock
      PRESENTATOR_SPEECH_SOCKET: /run/presentator-speech/speech.sock
      PRESENTATOR_BUILD_IMAGE: *build_image
      # The very volume declared below, under the name Docker gives it: one per
      # project, so a second instance on this machine builds into its own and
      # an instance that upgrades keeps the talks it has.
      PRESENTATOR_BUILD_VOLUME: ${COMPOSE_PROJECT_NAME}_builds
    # The socket is the one privilege this design trades for the sandbox: the
    # server may ask the daemon for a container, which is the daemon's whole
    # authority over this machine. The group is this machine's own, because a
    # gid is not a name.
    group_add:
      - "${PRESENTATOR_DOCKER_GROUP:?set it to the gid of this machine's docker group, which 'getent group docker' reads}"
    volumes:
      - database:/data/database
      - mirrors:/data/mirrors
      - builds:/data/builds
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COPRESENTER_SOCKET_DIRECTORY:?set it to the host co-presenter's private socket directory}:/run/presentator-copresenter:rw
      - ${SPEECH_SOCKET_DIRECTORY:?set it to the host speech private socket directory}:/run/presentator-speech:rw

  # The sealed build worker (ADR 0017). It runs the instance image and starts
  # no step of its own accord; nothing calls it until the instance is wired to
  # its socket. It never pulls: `docker compose build presentator` has to make
  # the image first, and a missing one is an error rather than a pull of some
  # registry's `presentator`. Every key below is a boundary the worker's
  # self-check or ADR 0017 relies on, and `tests/test_compose.py` pins them.
  build-worker:
    image: presentator
    pull_policy: never
    command: ["presentator-worker"]
    # Root with the runtime user's group: the controller is PID 1, drops to the
    # unprivileged users per child, and owns the socket for that group.
    user: "0:presentator"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges
    read_only: true
    network_mode: none
    ipc: private
    shm_size: 256m
    pids_limit: 512
    # Swap would double the bound, so the two are one number.
    mem_limit: 4g
    memswap_limit: 4g
    restart: always
    # PID 1 receives only the signals it has a handler for, and the controller
    # has none; SIGKILL ends it at once and the kernel then ends the namespace.
    stop_signal: SIGKILL
    tmpfs:
      - /work:size=2g,nr_inodes=200k,mode=755,nosuid,nodev
      - /tmp:size=512m,nr_inodes=10k,mode=1777,nosuid,nodev
    volumes:
      - type: volume
        source: build-socket
        target: /run/presentator-build
        volume:
          nocopy: true
    # Named without a value: a variable the project's environment does not set
    # stays unset, and the worker's own defaults apply.
    environment:
      - PRESENTATOR_BUILD_TIMEOUT_SECONDS
      - PRESENTATOR_BUILD_OUTPUT_MEGABYTES

  # Never started: it is the image a deck's own build runs in, and it is built
  # from the toolchain layer of the instance image, so the toolchain and its
  # browser are installed once. `docker compose --profile images build` builds
  # this one beside the instance.
  build-sandbox:
    build:
      context: .
      target: toolchain
      args:
        PRESENTATOR_RUNTIME_UID: ${PRESENTATOR_RUNTIME_UID:?set it to the positive non-root uid shared by Presentator and the host co-presenter}
    image: *build_image
    user: presentator
    profiles:
      - images

# Fixed, so that the address every connection through the published port
# carries is a value the operator can write down rather than read off a
# network Docker numbered by chance.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.255.0/24
          gateway: 172.31.255.1

volumes:
  database:
  mirrors:
  builds:
  # A tmpfs that starts as root's private 0750, so the instance cannot plant an
  # entry before the worker tightens the directory itself.
  build-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16k,nr_inodes=8,mode=0750,uid=0
