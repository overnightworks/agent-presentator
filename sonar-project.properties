sonar.organization=overnightworks
sonar.projectKey=overnightworks_agent-presentator
sonar.sources=src,frontend
sonar.tests=tests,frontend/tests

# Sonar refuses to index a file as source and test at once, and neither the
# installed packages, the lockfile, the prose nor a built deck are code.
sonar.exclusions=frontend/tests/**,frontend/node_modules/**,frontend/pnpm-lock.yaml,frontend/README.md,frontend/.nvmrc,examples/**/dist/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# The gate's `sonar` job downloads the `coverage` artifact of the `tests` job;
# the report sits at the artifact's root, the common directory of its upload.
sonar.python.coverage.reportPaths=coverage.xml

# why: tool configuration is not product code, so an uncovered vitest config
# line must not fail the quality gate.
sonar.coverage.exclusions=frontend/vitest.config.ts
