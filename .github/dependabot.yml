version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: uv
    directory: /speech
    schedule:
      interval: daily
  - package-ecosystem: uv
    directory: /speech/providers/chatterbox
    schedule:
      interval: daily
    ignore:
      # resemble-perth 1.0.1 imports pkg_resources, which setuptools removed in 82 (speech/README.md)
      - dependency-name: setuptools
        versions: [">=82"]
  - package-ecosystem: uv
    directory: /speech/providers/magpie
    schedule:
      interval: daily
  - package-ecosystem: uv
    directory: /speech/providers/qwen
    schedule:
      interval: daily
  - package-ecosystem: uv
    directory: /speech/providers/voxcpm
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
