name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A pull request collapses onto its newest push, but every push to main keeps a
# group of its own so no landing is ever cancelled by the next one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: "Python: architecture, lint, types"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Check types
        run: uv run --locked pyright

      - name: Check layer boundaries
        run: uv run --locked lint-imports

      - name: Check for dead code
        run: uv run --locked vulture

      - name: Check the root layout
        run: uv run --locked python scripts/check_root_layout.py

      - name: Check catalog purity
        run: uv run --locked python scripts/check_catalog_purity.py

  tests:
    name: "Python: tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Test
        run: uv run --locked pytest -q --cov=src --cov-report=xml:reports/coverage.xml

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: reports/coverage.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  speech:
    name: "Speech: lint, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: speech
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            speech/uv.lock
            speech/providers/chatterbox/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Test
        run: uv run --locked pytest -q

  chatterbox-provider:
    name: "Speech: Chatterbox provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: speech/providers/chatterbox
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            speech/uv.lock
            speech/providers/chatterbox/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        run: uv run --locked pytest -q tests

  qwen-provider:
    name: "Speech: Qwen provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: speech/providers/qwen
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: speech/providers/qwen/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        run: uv run --locked pytest -q tests/test_entrypoint.py tests/test_model.py

  voxcpm-provider:
    name: "Speech: VoxCPM provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: speech/providers/voxcpm
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: speech/providers/voxcpm/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src

      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src

      - name: Test
        run: uv run --locked pytest -q tests/test_entrypoint.py tests/test_model.py

  magpie-provider:
    name: "Speech: Magpie provider"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: speech/providers/magpie
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: speech/providers/magpie/uv.lock
          version: "0.10.9"
      - name: Verify the dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Check source
        run: uv run --locked ruff check src tests ../provider-contract/src
      - name: Check formatting
        run: uv run --locked ruff format --check src tests ../provider-contract/src
      - name: Test
        run: uv run --locked pytest -q tests/test_entrypoint.py tests/test_model.py

  copresenter:
    name: "Co-presenter: lint, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: copresenter
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: copresenter/uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check source
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Test
        run: uv run --locked pytest -q

  frontend:
    name: "Frontend: lint, types, tests, deck build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # pnpm has to exist before setup-node so that its cache can be primed.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The presenter-controls browser test reads the production security
      # policy through this Python environment, so it needs this instance's
      # own copy too — never a second, hand-copied value of it.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          version: "0.10.9"

      - name: Install locked Python dependencies
        working-directory: .
        run: uv sync --locked --all-groups

      - name: Check presenter controls
        working-directory: .
        run: |
          frontend/node_modules/.bin/eslint --config frontend/eslint.config.js \
            --global window --global document --global navigator --global fetch \
            --global WebSocket --global AudioContext --global AudioWorkletNode \
            --global AbortController --global TextDecoder --global atob --global URL \
            --global Blob --global Audio examples/copresenter-deck/custom-nav-controls.vue \
            examples/copresenter-deck/components/CoPresenter.vue \
            frontend/tests/presenter-controls.browser.test.ts

      - name: Check source
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: reports/frontend-coverage
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Build the example deck
        run: pnpm build:example

      - name: Upload the built example deck
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-deck
          path: examples/hello-deck/dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  image:
    name: "Container image"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag presentator:${{ github.sha }} .

      - name: Prove a configured UID that already belongs to the base image
        run: |
          docker build --build-arg PRESENTATOR_RUNTIME_UID=1000 --tag presentator:uid-1000 .
          test "$(docker inspect --format '{{.Config.User}}' presentator:uid-1000)" = presentator
          docker run --rm presentator:uid-1000 sh -c 'test "$(id -u)" = 1000 && test "$HOME" = /home/presentator'

      - name: Prove the build and wire users exist (cell 1)
        run: |
          image=presentator:${{ github.sha }}
          test "$(docker run --rm "$image" getent passwd presentator-build)" = \
            'presentator-build:x:10001:10001::/work/home:/usr/sbin/nologin'
          test "$(docker run --rm "$image" getent passwd presentator-wire)" = \
            'presentator-wire:x:10002:10002::/nonexistent:/usr/sbin/nologin'
          for uid in 10001 10002; do
            if docker build --build-arg PRESENTATOR_RUNTIME_UID=$uid --tag presentator:uid-$uid .; then
              echo "a runtime uid of $uid was accepted" >&2
              exit 1
            fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          version: "0.10.9"

      - name: Prove the image builds and exports a deck, as its users (cell 2)
        run: |
          docker build --target toolchain --tag presentator-build:${{ github.sha }} .
          uv sync --locked
          uv run --locked python scripts/prove_container_build.py \
            presentator-build:${{ github.sha }} presentator:${{ github.sha }}

      # An image without CA certificates builds cleanly and only fails once a
      # real HTTPS source is added, so the proof has to be an actual TLS
      # fetch, not a package-list check. The target is a public repository
      # distinct from this one, so the test does not depend on this
      # repository's own reachability.
      - name: Smoke test HTTPS reachability
        run: docker run --rm presentator:${{ github.sha }} git ls-remote https://github.com/git/git.git HEAD

  coverage:
    name: "Coverage report"
    needs:
      - tests
      - frontend
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The gate downloads the one artifact `coverage`; its Sonar scan reads
      # coverage.xml (pytest) and lcov.info (vitest) from the artifact's root.
      - name: Merge the coverage reports into one artifact
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          pattern: coverage-*
          delete-merged: true
          separate-directories: false
          retention-days: 7
          overwrite: true

  quality:
    name: quality
    needs:
      - python
      - tests
      - speech
      - chatterbox-provider
      - qwen-provider
      - voxcpm-provider
      - magpie-provider
      - copresenter
      - frontend
      - coverage
      - image
    if: always()
    uses: overnightworks/quality/.github/workflows/gate.yml@02fbdd0fb1873b9ba91ba7735886ff6f700da1cc # v0.5.0
    permissions:
      contents: read
      actions: read
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
